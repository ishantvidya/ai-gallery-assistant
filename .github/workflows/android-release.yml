name: android-release

# Builds a signed release APK on every push to main and every v* tag.
# Tags additionally get the APK attached to a GitHub Release, whose asset URL
# (releases/latest/download/gallery-assist.apk) the landing page links to.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gallery-assist.jks"
            echo "Keystore decoded."
          else
            echo "SIGNING_KEYSTORE_BASE64 not set — APK will be debug-signed (PR/fork builds)."
          fi

      - name: Build release APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/gallery-assist.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/*.apk gallery-assist.apk
          ls -la gallery-assist.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-assist-apk
          path: gallery-assist.apk

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gallery-assist.apk
          generate_release_notes: true
